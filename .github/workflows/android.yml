name: Android APK

# Builds a sideloadable release APK.
#
# `android/` is gitignored (see .gitignore), so every run regenerates it with
# `expo prebuild` before Gradle ever sees it. Nothing native is committed.
#
# The APK is signed with the debug key that Expo's prebuild template ships:
# the generated app/build.gradle points `release` at `signingConfigs.debug`.
# That is fine for sideloading onto your own device and needs no secrets, but
# it is not publishable to the Play Store. To move to a real keystore, add the
# four ANDROID_* secrets and a signingConfigs block via a config plugin.

on:
  workflow_dispatch:
    inputs:
      api_url:
        description: "EXPO_PUBLIC_API_URL baked into the build (e.g. https://api.example.com)"
        required: false
        type: string
      architectures:
        description: "ABIs to build"
        required: false
        default: arm64-v8a
        type: choice
        options:
          - arm64-v8a
          - arm64-v8a,armeabi-v7a
          - armeabi-v7a,arm64-v8a,x86,x86_64
  # Tagging a version builds it and attaches the APK to a GitHub Release.
  #
  # Deliberately no `branches: [main]` trigger: a build is ~10 minutes of the
  # 2000 free minutes/month a private repo gets, and most commits do not need
  # an APK. Add the two commented lines below if you want one per push, but
  # note that mixing `branches` and `tags` under a single `push` makes the
  # `paths` filter apply to tag pushes too, which can silently skip releases.
  push:
    tags: ["v*"]
    # branches: [main]
    # paths: ["apps/mobile/**", "packages/shared/**", "pnpm-lock.yaml"]

permissions:
  contents: write

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

env:
  # Release builds have no Metro server to infer a LAN address from, so
  # resolveApiUrl() would fall through to http://localhost:3000, which on a
  # phone means the phone itself. Set the repo variable API_URL (Settings →
  # Secrets and variables → Actions → Variables) to point at your deployed API.
  EXPO_PUBLIC_API_URL: ${{ inputs.api_url || vars.API_URL }}
  EXPO_NO_TELEMETRY: "1"
  # arm64-v8a covers every phone sold in the last decade. Building all four
  # ABIs roughly triples both the build time and the APK size.
  RN_ARCHS: ${{ inputs.architectures || 'arm64-v8a' }}

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      # Every action in this repository is pinned to a commit SHA, with the
      # release it points at in the trailing comment.
      #
      # A tag is a mutable pointer: whoever controls the action's repository
      # can move `v4` onto different code at any time, and none of the four
      # workflows here would notice. This one runs with `contents: write` and
      # signs and publishes the file people install; update.yml and
      # rollback.yml hold EXPO_TOKEN, and an update published with that token
      # reaches every phone on its next launch with no review in between.
      #
      # Pinning alone would only trade a moving target for a rotting one, so
      # .github/dependabot.yml moves these weekly. It reads the trailing
      # comment to know which version a SHA stands for and rewrites both
      # together, which is why the comment is not decoration: keep it accurate
      # if you ever change a pin by hand.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Must precede setup-node so that `cache: pnpm` can find the binary.
      # Version comes from the root package.json `packageManager` field.
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: pnpm

      - uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v6.0.0
        with:
          distribution: temurin
          java-version: 17

      # Restores the Gradle cache and writes a build report to the job summary.
      - uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0

      # The runner ships an Android SDK, but Gradle may pull a build-tools or
      # platform revision that has no license on record yet.
      - name: Accept Android SDK licenses
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null 2>&1 || true

      # Six files carry the version and nothing used to compare them. It
      # matters here in particular because `Stage APK` below names the release
      # asset from app.json and reads none of the other five: a bump that
      # missed app.json ships `lift-0.14.1-...apk` for what is really 0.15.0,
      # and a bump that touched only app.json leaves five manifests behind.
      # Neither shows up as anything but a green build.
      #
      # On a tag push this also compares the tag against the tree, which is the
      # failure that is impossible to fix after the fact: the tag is what the
      # OTA workflow publishes against and what someone is told to download.
      #
      # Pure Node and no install, so it costs seconds and runs before the forty
      # minutes of Gradle rather than after.
      - name: Verify versions agree
        run: |
          if [ "$GITHUB_REF_TYPE" = "tag" ]; then
            node scripts/release.mjs check --expect "$GITHUB_REF_NAME"
          else
            node scripts/release.mjs check
          fi

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Warn if API URL is unset
        if: env.EXPO_PUBLIC_API_URL == ''
        run: |
          echo "::warning title=No API URL::EXPO_PUBLIC_API_URL is empty, so the app will fall back to http://localhost:3000 and sync will not work. Set the API_URL repository variable."

      # What this APK will and will not accept over the air.
      #
      # `runtimeVersion` is on the fingerprint policy, so this hash stands for
      # every input that shapes the native app: the config plugins, app.json,
      # the dependency list. Gradle embeds it below, and the OTA workflow prints
      # the same figure for what it published. An update only reaches a build
      # whose hash matches, so when someone reports that updates have stopped
      # arriving, these two numbers are the first thing to compare.
      #
      # Resolved before prebuild, which is where `eas update` also stands when
      # it computes its own. `android/` is gitignored, so fingerprint treats
      # this as a managed project and does not hash the generated directory at
      # all, which is what lets the two agree.
      - name: Resolve runtime version
        id: runtime
        working-directory: apps/mobile
        run: |
          version=$(node ../../node_modules/expo-updates/bin/cli.js runtimeversion:resolve --platform android \
            | node -p "JSON.parse(require('fs').readFileSync(0,'utf8')).runtimeVersion")
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Generate native project
        working-directory: apps/mobile
        run: pnpm exec expo prebuild --platform android --no-install

      # Expo's template writes `-Xmx2048m -XX:MaxMetaspaceSize=512m`, which was
      # enough until expo-updates put KSP in the build graph. Kotlin symbol
      # processing loads a compiler's worth of class metadata, and metaspace is
      # not the heap: it does not get collected under pressure the same way, so
      # the daemon spends itself failing to reclaim and then dies with
      # `OutOfMemoryError: Metaspace`. The visible symptom was a 45 minute build
      # that failed in the resource tasks, which are collateral rather than the
      # cause.
      #
      # Appended rather than set in the file, because android/ is regenerated by
      # prebuild on every run. Java property files take the last definition of a
      # key, so this wins over the template's line above it.
      #
      # Deliberately not expo-build-properties, which is the tidier way to reach
      # gradle.properties: that is a dependency, dependencies are fingerprint
      # inputs, and adding one here would move the runtime version and strand
      # every update already published against the current one. This is a
      # property of the build, not of the app, so the workflow is where it goes.
      #
      # The runner has 16 GB and 4 cores, so both daemons fit with room over.
      - name: Raise Gradle memory limits
        working-directory: apps/mobile/android
        run: |
          {
            echo ""
            echo "org.gradle.jvmargs=-Xmx4g -XX:MaxMetaspaceSize=2g"
            echo "kotlin.daemon.jvmargs=-Xmx2g -XX:MaxMetaspaceSize=1g"
          } >> gradle.properties

      # Two flags, ~22 MB. Both belong here for the reason the step above gives:
      # gradle.properties after prebuild is a property of the build, so it costs
      # no fingerprint movement, where expo-build-properties would.
      #
      # v0.8.0 shipped at 58.9 MB for arm64-v8a alone. Taken apart, that was
      # 23.70 MB of native libraries, 20.33 MB of dex across *six* files, and a
      # 7.56 MB Hermes bundle.
      #
      # Six dex files is what an unminified build looks like, and the dex
      # confirmed it: every class name fully qualified, with Guava, Apache HTTP
      # and the whole of BouncyCastle shipped as dead weight. The RN template
      # defaults `android.enableMinifyInReleaseBuilds` to false and nothing had
      # ever turned it on.
      #
      # The libraries were all STORED rather than deflated, which is what
      # `expo.useLegacyPackaging=false` means: Android mmaps them straight out
      # of the APK, so the install is smaller and startup is quicker, and the
      # download carries them uncompressed. That is the right default for a Play
      # Store app measured on install size and the wrong one here, where the APK
      # is a file someone taps in a mobile browser. Native code deflates by
      # roughly half. The trade is real and worth restating if it is ever
      # revisited: on-device footprint goes up by about the uncompressed size,
      # because the system extracts what it can no longer map.
      #
      # The Hermes bundle is left stored deliberately. It compresses about as
      # well as the libraries do, and it is mmapped for the same reason, but it
      # is read on the launch path rather than lazily, so the ~4 MB would be
      # paid back as startup latency on every cold start.
      #
      # Next lever if this is not enough, in order: resource shrinking
      # (`android.enableShrinkResourcesInReleaseBuilds`, worth part of the
      # 2.19 MB resources.arsc, left off here so this change stays one testable
      # thing), and the 2.64 MB of icon fonts, of which the app uses Ionicons
      # and ships nineteen families.
      - name: Shrink the release build
        working-directory: apps/mobile/android
        run: |
          {
            echo ""
            echo "android.enableMinifyInReleaseBuilds=true"
            echo "expo.useLegacyPackaging=true"
          } >> gradle.properties

      # R8 removes what nothing appears to reference, and a keep rule is how a
      # library says "reflection reaches this". React Native, expo-modules-core,
      # expo-updates, expo-notifications, expo-image and react-native-svg all
      # declare `consumerProguardFiles`, so AGP merges theirs automatically and
      # nothing is needed for them here.
      #
      # Reanimated and react-native-worklets ship a `proguard-rules.pro` each and
      # wire neither, so theirs is merged by nobody. The prebuild template
      # hand-copies the first two lines of reanimated's into app/proguard-rules.pro
      # and stops there, which leaves the Fabric keep and the whole of worklets
      # missing. This app is on the new architecture with reanimated 4, so both
      # of those are load-bearing.
      #
      # The failure they prevent is a runtime one, not a build one: R8 succeeds,
      # the APK installs, and the first screen that animates crashes on a class
      # that is no longer there. Which is why this needs a build someone
      # actually opens before it is tagged.
      - name: Keep classes reached by reflection
        working-directory: apps/mobile/android
        run: |
          {
            echo ""
            echo "# react-native-worklets and reanimated, neither of which wires"
            echo "# its own consumerProguardFiles. See the workflow step above."
            echo "-keep class com.swmansion.worklets.** { *; }"
            echo "-keep class com.swmansion.reanimated.** { *; }"
            echo "-keep class com.facebook.react.turbomodule.** { *; }"
            echo "-keep class com.facebook.react.fabric.** { *; }"
          } >> app/proguard-rules.pro

      # The fingerprint the APK embeds, pinned to the one resolved above.
      #
      # Without this the build computes its own, and it computes it wrong. The
      # task that writes `assets/fingerprint` runs *during* the Gradle build,
      # and by then Gradle has written `build/` directories into the packages
      # under node_modules that `@expo/fingerprint` hashes. The v0.6.1 APK came
      # out at 0bcbd1e6 while every clean checkout, including the one `eas
      # update` publishes from, resolves 026503a8. Two sources differed:
      # @react-native-masked-view/masked-view and expo-updates' own Gradle
      # plugin, both of them directories the build had already written into.
      #
      # The effect is the silent one again. The APK asks for updates under a
      # hash that exists nowhere, the server truthfully answers that there are
      # none, and the app reports itself up to date forever.
      #
      # `EXPO_UPDATES_FINGERPRINT_OVERRIDE` is expo-updates' own hook for this
      # (see utils/build/createFingerprintForBuildAsync.js). The value comes
      # from the resolve step above, which runs before prebuild and before
      # anything has been built, so it is the same figure a clean checkout
      # produces and therefore the same one the update is published against.
      - name: Build release APK
        working-directory: apps/mobile/android
        env:
          EXPO_UPDATES_FINGERPRINT_OVERRIDE: ${{ steps.runtime.outputs.version }}
        run: ./gradlew :app:assembleRelease -PreactNativeArchitectures="$RN_ARCHS" --console=plain

      # Reads back what actually landed in the APK, rather than trusting that
      # the override above was honoured.
      #
      # This is the check that was missing when v0.6.1 shipped: everything
      # reported success, both workflows printed a runtime version, and the two
      # numbers were never compared against the binary. `assets/fingerprint` is
      # the file the app reads at launch to decide which updates apply to it, so
      # it is the only figure that actually decides whether updates work.
      - name: Verify embedded fingerprint
        run: |
          embedded=$(unzip -p apps/mobile/android/app/build/outputs/apk/release/app-release.apk assets/fingerprint)
          expected="${{ steps.runtime.outputs.version }}"
          echo "embedded: $embedded"
          echo "expected: $expected"
          if [ "$embedded" != "$expected" ]; then
            echo "::error title=Fingerprint mismatch::The APK embeds '$embedded' but updates are published against '$expected'. This build would never accept an update. See the note on EXPO_UPDATES_FINGERPRINT_OVERRIDE above."
            exit 1
          fi

      - name: Stage APK
        id: stage
        run: |
          src=apps/mobile/android/app/build/outputs/apk/release/app-release.apk
          version=$(node -p "require('./apps/mobile/app.json').expo.version")
          name="lift-${version}-${GITHUB_RUN_NUMBER}-$(git rev-parse --short HEAD).apk"
          mkdir -p dist && cp "$src" "dist/$name"
          echo "name=$name" >> "$GITHUB_OUTPUT"
          echo "path=dist/$name" >> "$GITHUB_OUTPUT"
          {
            echo "### APK ready"
            echo ""
            echo "| | |"
            echo "|---|---|"
            echo "| File | \`$name\` |"
            echo "| Size | $(du -h "dist/$name" | cut -f1) |"
            echo "| ABIs | \`$RN_ARCHS\` |"
            echo "| API URL | \`${EXPO_PUBLIC_API_URL:-(unset, sync disabled)}\` |"
            echo "| Runtime version | \`${{ steps.runtime.outputs.version }}\` |"
            echo ""
            echo "This build accepts over-the-air updates published against that"
            echo "runtime version and no other. See the OTA Update workflow."
          } >> "$GITHUB_STEP_SUMMARY"

      # The comparison the `du -h` above never had.
      #
      # Both minification flags are appended by a shell step to a
      # gradle.properties that `expo prebuild` regenerates on every run, so
      # nothing fails if one of them stops taking effect. The APK just gets big
      # again: v0.8.0 shipped at 58.9 MB for arm64-v8a alone, against roughly
      # 31 MB now. This reads the zip directory and compares the total against
      # scripts/perf/apk-baseline.json, and names the two causes it can
      # recognise rather than only the symptom, since "the APK grew 40%" is a
      # much slower thing to act on than "R8 is no longer running".
      #
      # Runs after Stage APK so it measures the same file that is uploaded, and
      # writes its breakdown to the job summary before it decides, so a
      # regression is diagnosable from the summary alone.
      - name: Check APK size
        run: node scripts/perf/apk-size.mjs "${{ steps.stage.outputs.path }}" --abis "$RN_ARCHS"

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ steps.stage.outputs.name }}
          path: ${{ steps.stage.outputs.path }}
          if-no-files-found: error
          retention-days: 30

      # Artifacts are zipped and need a logged-in GitHub session to download,
      # which is awkward on a phone. Tagged builds also publish the raw APK as
      # a release asset so it can be downloaded directly in a mobile browser.
      #
      # `--generate-notes` derives a body from merged pull requests and this
      # project has none, so every release note so far has been a bare compare
      # link. The commit subjects were the notes all along; scripts/release.mjs
      # collects them into CHANGELOG.md and `notes` lifts one section out.
      #
      # The fallback is deliberate and is why this is a variable rather than a
      # second command: an extraction that finds nothing leaves the publish
      # exactly as it has always been rather than replacing a thin release note
      # with no release at all.
      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          notes="$RUNNER_TEMP/release-notes.md"
          node scripts/release.mjs notes "${GITHUB_REF_NAME}" > "$notes" || true
          # An `if` rather than `[ -s ... ] && ...`, because these blocks run
          # under `bash -e`: a false test at statement level would abort the
          # step, and it would abort it on exactly the path the fallback is
          # here to cover.
          notes_arg=--generate-notes
          if [ -s "$notes" ]; then
            notes_arg="--notes-file=$notes"
          fi
          gh release create "${GITHUB_REF_NAME}" "${{ steps.stage.outputs.path }}" "$notes_arg" || gh release upload "${GITHUB_REF_NAME}" "${{ steps.stage.outputs.path }}" --clobber
