name: CI

# The gate the other two workflows do not have.
#
# `android.yml` and `update.yml` both trigger on a `v*` tag and nothing else, so
# before this file existed a tag went from `pnpm install` straight to a release
# APK and an `eas update` with no compiler in between. An OTA reaches every
# install on its next launch, which makes "does it typecheck" a question worth
# answering before the tag, not after the phones have it.

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

# A second push to the same branch makes the first one's answer irrelevant.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # -------------------------------------------------------------------------
  check:
    name: Typecheck, lint and unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      # Pinned to a commit SHA with the version in the trailing comment, the
      # same as the other three workflows. The full reasoning is in
      # android.yml; .github/dependabot.yml is what keeps the pins current.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Must precede setup-node so that `cache: pnpm` can find the binary.
      # Version comes from the root package.json `packageManager` field.
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: pnpm

      # Six files carry the version and nothing used to compare them, so drift
      # was invisible until a release asset came out named after the wrong one.
      # Pure Node, no install, so it answers in seconds and answers first.
      # scripts/release.mjs is also what writes those six and CHANGELOG.md.
      - name: Verify versions agree
        run: node scripts/release.mjs check

      # Pure Node like the check above, so it runs before the dependency work
      # rather than after it. It re-measures every contrast ratio tokens.ts and
      # palettes.ts state beside their values, across all eight themes in
      # THEMES. The failure it exists to catch is a colour nudged by eye that
      # takes a role under AA on one theme out of eight, which nothing else in
      # this repo would notice: three had already happened before it ran.
      - name: Audit the palettes
        run: node scripts/audit-palette.mjs

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # patches/expo-sqlite@57.0.1.patch is load-bearing rather than tidying:
      # the reasoning is in pnpm-workspace.yaml beside the entry, and the cost
      # of losing it is that every query result over 255 bytes comes back
      # truncated mid-JSON on the web build, so each screen renders its empty
      # state. It fails as an app that looks like it has no data, never as an
      # error, which is why it is worth a check of its own.
      #
      # pnpm keys a patch on an exact version. A bump to 57.0.2 leaves the
      # patch naming a package that is no longer installed, and dependabot
      # groups expo-sqlite with the rest of the Expo SDK, so that bump arrives
      # inside a forty-package pull request where nothing else would catch it.
      - name: Check the patched dependency
        run: |
          patched=$(sed -n 's/^ *expo-sqlite@\([0-9][^:]*\):.*/\1/p' pnpm-workspace.yaml)
          # `|| echo` rather than letting `bash -e` take the step down on the
          # node error: an expo-sqlite that will not resolve at all is a real
          # failure, but it is worth reporting through the message below rather
          # than as a resolver stack trace.
          installed=$(node -p "require(require.resolve('expo-sqlite/package.json', { paths: ['apps/mobile', '.'] })).version" 2>/dev/null || echo "(does not resolve)")
          echo "patched:   ${patched:-(none found in pnpm-workspace.yaml)}"
          echo "installed: $installed"
          if [ "$patched" != "$installed" ]; then
            echo "::error title=The expo-sqlite patch is not being applied::pnpm-workspace.yaml patches expo-sqlite@$patched but $installed is what is installed. Re-cut it with 'pnpm patch expo-sqlite@$installed', apply the same two fixes, and update patchedDependencies. Do not simply widen the version key: the patch is written against specific lines."
            exit 1
          fi

      # Load-bearing, and it has to come first. `@lift/shared` resolves through
      # its exports map: Metro takes the `react-native` condition and reads the
      # source, but `tsc` in apps/api and apps/mobile takes `default` and reads
      # `dist`. Skip this and every typecheck below fails on a package that is
      # sitting right there in the tree.
      - name: Build the shared package
        run: pnpm --filter @lift/shared build

      # apps/landing's tsconfig includes `.next/types/**/*.ts`, and `.next/` is
      # gitignored. `LayoutProps` and the route types live only there, so on a
      # clean checkout `tsc` fails on names that exist on every developer
      # machine. Cheap: `typegen` writes the types without doing a build.
      - name: Generate Next types
        run: pnpm --filter @lift/landing exec next typegen

      - name: Typecheck
        run: pnpm -r typecheck

      # Reaches apps/mobile and apps/landing only. apps/api and packages/shared
      # define no `lint` script and carry no eslint dependency, so `pnpm -r lint`
      # skips them silently rather than failing. Said out loud here because a
      # green lint job that covered half the repo would otherwise read as full
      # coverage.
      - name: Lint
        run: pnpm -r lint

      - name: Unit tests
        run: pnpm --filter @lift/shared test

  # -------------------------------------------------------------------------
  # The sync protocol against a real Postgres.
  #
  # These are the tests that would have caught a batch being discarded by one
  # bad mutation, a row stored with a timestamp years into the future, and a
  # pull reporting itself complete with rows still past the cursor. None of
  # that reproduces without a server and a database, which is why this job
  # exists rather than being folded into the one above.
  sync-e2e:
    name: Sync end-to-end
    runs-on: ubuntu-latest
    timeout-minutes: 20

    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: lift
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: lift
        ports:
          - 5432:5432
        # The API applies migrations before it listens, so it needs a database
        # that is genuinely ready rather than merely started.
        options: >-
          --health-cmd "pg_isready -U lift -d lift"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: |
          pnpm --filter @lift/shared build
          pnpm --filter @lift/api build

      # Migrations run on boot, so a schema that will not apply fails here as a
      # server that never becomes healthy, which is the same way it would fail
      # on a deploy.
      - name: Start the API
        env:
          DATABASE_URL: postgres://lift:ci@localhost:5432/lift
          BETTER_AUTH_SECRET: ci-secret-not-used-outside-this-job
          BETTER_AUTH_URL: http://localhost:3999
          TRUSTED_ORIGINS: lift://,http://localhost:8081
          PORT: 3999
        run: |
          node apps/api/dist/main.js > "$RUNNER_TEMP/api.log" 2>&1 &
          echo $! > "$RUNNER_TEMP/api.pid"
          for i in $(seq 1 60); do
            if curl -sf http://localhost:3999/health > /dev/null; then
              echo "API healthy after ${i}s"
              exit 0
            fi
            sleep 1
          done
          echo "::error title=API never became healthy::See the log below."
          cat "$RUNNER_TEMP/api.log"
          exit 1

      - name: Run the sync suite
        run: python3 apps/api/test/sync-e2e.py

      # The suite asserts over responses; a warning the server logged while
      # answering them is the other half of the story.
      - name: API log
        if: always()
        run: cat "$RUNNER_TEMP/api.log" || true

  # -------------------------------------------------------------------------
  # Advisories and Expo's own configuration check. Neither is allowed to fail a
  # build, and the reason differs for each.
  #
  # `pnpm audit` reports against the whole tree, and most of that tree is dev
  # dependencies that never run anywhere but a laptop and a runner. A high
  # advisory in a build tool is worth reading on a Monday; it is not worth
  # standing between a fix and the phones waiting for it. `expo-doctor` checks
  # a list of things this repository deliberately does differently, notably the
  # patched expo-sqlite and the gitignored `android/`, so a clean result is not
  # something to hold a release to either.
  #
  # Read them. The point of a non-blocking job is that somebody looks, not that
  # nobody does.
  supply-chain:
    name: Advisories and expo-doctor
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Neutral rather than red, so the checks that do block stay meaningful.
    continue-on-error: true

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: pnpm

      # Before the install, because it reads the lockfile and the registry
      # rather than node_modules, so it still reports if the install fails.
      - name: Advisories
        continue-on-error: true
        run: pnpm audit --audit-level moderate

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # `dlx` fetches expo-doctor at head rather than pinning it, which nothing
      # else in these workflows is allowed to do. It is tolerable here and
      # nowhere else: this job takes no secrets, has `contents: read` from the
      # workflow above, and produces nothing that anything else consumes.
      - name: expo-doctor
        continue-on-error: true
        working-directory: apps/mobile
        run: pnpm dlx expo-doctor

  # -------------------------------------------------------------------------
  # All three images are built from this repository by Dokploy on deploy, from
  # whatever git resolves to. Building them here means a Dockerfile that no
  # longer builds is a failed check rather than a failed deploy.
  docker:
    name: Docker images build
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Build the API image
        run: docker build -f apps/api/Dockerfile -t lift-api:ci .

      # The web app is the mobile app's own static export. Its API URL is baked
      # in by Metro at build time, so it takes a build argument rather than an
      # environment variable, and the build fails outright without one. The
      # value here only has to exist; nothing in this job calls it.
      - name: Build the web image
        run: docker build -f apps/mobile/Dockerfile --build-arg EXPO_PUBLIC_API_URL=https://ci.invalid -t lift-web:ci .

      - name: Build the landing image
        run: docker build -f apps/landing/Dockerfile --build-arg NEXT_PUBLIC_SITE_URL=https://ci.invalid -t lift-landing:ci .
