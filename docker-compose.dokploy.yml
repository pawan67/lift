# Production stack for Dokploy. Set the Compose Path to this file, not to
# docker-compose.yml: that one is the local development stack, and it brings
# its own Postgres and publishes both services on host ports.
#
# The database is Dokploy's own Postgres service, so it is not defined here.
# Paste the connection string that service gives you into DATABASE_URL and it
# is used as-is. Nothing is published: Traefik reaches every service over
# dokploy-network, which is also how the database hostname resolves.
#
# Three services means three domains in Dokploy, all on port 3000 inside their
# own containers:
#
#   api       port 3000
#   web       port 3000   (the Next.js web app; see apps/web)
#   landing   port 3000   (the marketing page)
#
#   BETTER_AUTH_URL       the API's own public URL, scheme included. The web
#                         app reaches the API through this address too.
#   TRUSTED_ORIGINS       `lift://` for the phone app. Neither the web app nor
#                         the landing page belongs here: the web app talks to
#                         the API from its own server, and the landing page
#                         never talks to it at all.
#
# `web` used to be the phone app exported for a browser (apps/mobile/Dockerfile,
# nginx on port 80). It is now apps/web, so a domain created for the old
# service has to have its container port changed from 80 to 3000.

services:
  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    restart: unless-stopped
    environment:
      DATABASE_URL: ${DATABASE_URL:?set DATABASE_URL}
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET:?set BETTER_AUTH_SECRET}
      # Must match the domain exactly, scheme included: cookies and OAuth
      # callbacks are derived from it.
      BETTER_AUTH_URL: ${BETTER_AUTH_URL:?set BETTER_AUTH_URL}
      # The phone app's scheme, `lift://`. The web app does not need its origin
      # here (it proxies through its own server). A browser request from an
      # origin that is not listed is rejected before it reaches a handler.
      TRUSTED_ORIGINS: ${TRUSTED_ORIGINS:-lift://}
      # Optional. The Telegram bot's token from @BotFather; empty leaves the bot
      # off and the app hides its page.
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      USDA_API_KEY: ${USDA_API_KEY:-}
      PORT: 3000
    expose:
      - '3000'
    networks:
      - dokploy-network

  # The web app: statistics, the exercise library, routines and body
  # measurements in a browser, built with Next.js. See apps/web/Dockerfile.
  #
  # It reaches the API from its own server (sign-in and sync are proxied), so its
  # origin does not need to be in TRUSTED_ORIGINS. LIFT_API_URL defaults to
  # BETTER_AUTH_URL, which is the API's public address: the proxy presents that
  # address as its Origin, and better-auth always trusts its own base URL. It is
  # read at runtime, so pointing it elsewhere is a restart, not a rebuild.
  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    restart: unless-stopped
    environment:
      LIFT_API_URL: ${LIFT_API_URL:-${BETTER_AUTH_URL:?set BETTER_AUTH_URL}}
    expose:
      - '3000'
    networks:
      - dokploy-network

  # The marketing page. Nothing else in this stack depends on it, and it depends
  # on nothing here — deploying it cannot take the app down, and the app being
  # down does not take it down.
  #
  # A Node server rather than a directory of static files. The download button shows the version and size of the
  # release GitHub is currently serving, read from GitHub's API and revalidated
  # hourly; an export would freeze that at whatever was true when the image was
  # built. See apps/landing/lib/release.ts.
  landing:
    build:
      context: .
      dockerfile: apps/landing/Dockerfile
      args:
        # A build arg rather than an environment variable, because that is what
        # it is: `NEXT_PUBLIC_*` is substituted into the bundle by the compiler.
        # Changing this means rebuilding the image — restarting the container
        # with a new value does nothing at all.
        #
        # This is the landing page's *own* public URL, the one people will type,
        # and it is what the social card's image URL is resolved against. Unset
        # or wrong and the page still looks perfect while every share preview
        # comes back blank.
        NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL:?set NEXT_PUBLIC_SITE_URL to the landing page's public URL}
        # Where "Open the web app" points: the `web` service's public URL.
        # Optional; left empty, the page links to the address in
        # apps/landing/lib/site.ts.
        NEXT_PUBLIC_WEB_APP_URL: ${NEXT_PUBLIC_WEB_APP_URL:-}
    restart: unless-stopped
    expose:
      - '3000'
    networks:
      - dokploy-network

networks:
  # Traefik's network, and the one Dokploy's database services sit on. The API
  # has to join it both to be routable and to resolve the database host.
  dokploy-network:
    external: true
